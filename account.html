<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>내 계정 | Spire Analytics</title><link rel="stylesheet" href="/styles.css"><script defer src="/account.js"></script></head>
<body><main class="auth-panel"><header><p>Spire Analytics</p><h1>내 계정</h1></header><p id="name"></p>
