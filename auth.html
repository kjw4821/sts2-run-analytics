<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>계정 | Spire Analytics</title><link rel="stylesheet" href="/styles.css"><script src="/auth.js" defer></script></head>
<body><main class="auth-panel"><header><p>Spire Analytics</p><h1 id="title">로그인</h1></header>
<form id="auth-form"><label>아이디<input id="username" autocomplete="username" required></label>
<label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label>
<label hidden id="confirm-label">비밀번호 확인<input id="confirm" type="password" autocomplete="new-password"></label>
<p id="notice" role="status"></p><button id="submit">로그인</button></form>
<a id="switch" href="/signup">회원가입</a></main></body></html>
